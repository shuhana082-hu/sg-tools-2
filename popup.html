<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>Site capture</h1>
  <button id="toggle" class="pill">Start capture (reloads this page)</button>
  <p class="desc">Turn on, then open every page / click every option of the site. Every file is saved at its original path (images, video, fonts, big files too). Then ZIP &rarr; Downloads and host the ZIP as the site.</p>
  <label class="chk"><input type="checkbox" id="inc"> Include other hosts (fonts, CDN) under _ext/</label>
  <label class="chk"><input type="checkbox" id="api"> Save API responses under _api/</label>
  <div id="stats" class="stats">0 files · 0.0 MB · queued 0</div>
  <div class="row">
    <button id="zip" class="btn">&#8595; ZIP &rarr; Downloads</button>
    <button id="clear" class="btn ghost">Clear</button>
  </div>
  <div id="list" class="list"></div>
  <script src="lib/jszip.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
